# Production-style stack — app.main:app API (multi-worker uvicorn). Each
# uvicorn worker process starts its own in-process Service Bus consumer thread
# via app.main's lifespan (CourseGenerationWorker) — there is no separate
# worker module/process to run alongside it.
# Usage:
#   cp .env.example .env   # all Azure + DATABASE_URL vars required
#   docker compose -f docker-compose.prod.yml up --build -d
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lectora-backend:prod
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
    volumes:
      - lectora-data:/app/data
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "4",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  lectora-data:
